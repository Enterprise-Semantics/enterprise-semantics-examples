# Foundational example: OTCHERE Inc Fulfillment Autonomous Enterprise
#
# Per CR-ES-011 §21 + ADR-ES-011 §23.
# Demonstrates the canonical Autonomous Enterprise operating condition:
# a mixed enterprise where material aspects of enterprise value
# realisation, coordination, execution, and adaptation can progress
# independently within defined objectives, authority, policies,
# constraints, and governance boundaries, without requiring human
# intervention for every enterprise decision or action.
#
# Per CR-ES-011 §21, the example explicitly demonstrates:
#   - Enterprise Objective
#   - Authority
#   - Policies
#   - Constraints
#   - Decision Scope
#   - Action Scope
#   - Autonomy Scope
#   - Intervention Model
#   - Escalation Boundary
#   - Enterprise Outcomes
#
# Per CR-ES-011 §21, the example demonstrates a mixed operating model:
# autonomous value streams alongside agentic, conventional, and
# human-led operations. The Autonomous Enterprise does NOT require
# every enterprise activity to be autonomous (per AE-AUTO-CON-017).
#
# The example remains technology-neutral. No AI vendor, no specific
# framework, no LLM. Per CR-ES-011 §3 + ADR-ES-011 §18.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:EXAMPLE:otchere-autonomous-enterprise
canonical_name: OTCHERE Inc Fulfillment Autonomous Enterprise
status: Candidate
per_axis_i: foundational
provenance:
  - source: CR-ES-011 §21
    note: Worked example illustrating Autonomous Enterprise operating condition.
  - source: ADR-ES-011 §23
    note: |
      Foundational example. OTCHERE Inc Fulfillment Autonomous
      Enterprise. Enterprise-level autonomous operation via the
      Autonomous Enterprise Operating Loop. 22 invariants, 18
      negative invariants, mixed realisation across autonomous,
      agentic, conventional, and human-led operations.

# Enterprise objective

enterprise_objective: |
  Per ADR-ES-011 §1 + §7 + §8 + CR-ES-011 §2: the Autonomous
  Enterprise pursues an enterprise-level objective of fulfilling
  OTCHERE Inc customer orders while maintaining service-level
  commitments, optimising inventory policy, and delivering
  measurable customer and enterprise value.

# Authority

authority_context: |
  Per AE-AUTO-CON-005 + AE-AUTO-CON-018: the enterprise operates
  within defined authority. The OTCHERE Inc fulfillment authority
  is bounded by:

  - revenue_threshold_per_action: USD 75,000 (autonomous decisions
    below this threshold escalate above)
  - credit_limit_extension: USD 50,000 (autonomous decisions below
    this threshold do not require credit committee approval)
  - logistics_carrier_switching: yes (autonomous within approved
    carrier roster)
  - inventory_reorder: yes (autonomous within policy band)
  - exception_escalation_threshold: severity >= medium

  An instance with authority = unrestricted fails conformance.

# Policies

policy_context: |
  Per AE-AUTO-CON-006 + ADR-ES-011 §15: the enterprise operates
  under defined policies. The OTCHERE Inc fulfillment policy
  framework:

  - customer_commitment_policy: SLA-tier (Gold, Silver, Bronze)
  - inventory_policy: reorder_point_band (target_band: 0.3 to 0.7
    of maximum_stock)
  - data_privacy_policy: zero PII in autonomous decision rationales
  - audit_trail_policy: full decision log with rationale retention
    for 7 years
  - human_intervention_policy: human approval required for orders
    exceeding revenue_threshold_per_action

# Constraints

constraint_context: |
  Per ADR-ES-011 §15: the enterprise operates within defined
  constraints. The OTCHERE Inc fulfillment constraint set:

  - regulatory: data privacy regulation (no PII in autonomous logs)
  - financial: working capital exposure cap (USD 10M aggregate
    inventory)
  - operational: SLA minimum commitment (Gold tier = 12h fulfillment)
  - capacity: warehouse throughput ceiling (24,000 orders / day)

# Decision scope

decision_scope: |
  Per AE-AUTO-CON-007 + ADR-ES-011 §7.1 + CR-ES-011 §4 + §16: the
  enterprise may autonomously make the following decisions:

  - demand response interpretation
  - resource allocation (within capacity constraints)
  - operational prioritisation
  - fulfillment path selection (within approved carrier roster)
  - inventory reorder (within reorder_point_band)
  - service response tier assignment
  - exception resolution (severity < medium)
  - customer credit limit assessment (within credit_limit_extension)
  - cross-channel demand rebalancing
  - supplier contract renewal (within approved roster)

  Decisions outside this scope escalate to human authority per the
  escalation boundary below.

# Action scope

action_scope: |
  Per AE-AUTO-CON-008 + ADR-ES-011 §7.3 + CR-ES-011 §4 + §16: the
  enterprise may autonomously execute the following actions:

  - issue purchase orders to suppliers (within reorder band)
  - allocate orders to fulfillment centers
  - select logistics carrier (within approved roster)
  - send customer notifications (within template library)
  - apply SLA-tier credits (within credit cap)
  - rebalance demand across channels
  - close / open fulfillment routes (within capacity)
  - escalate to human authority (when required by escalation
    boundary)

  Actions outside this scope require human approval per the
  intervention model below.

# Autonomy scope

autonomy_scope: |
  Per AE-AUTO-CON-002 + ADR-ES-011 §6: the enterprise autonomy
  scope is material enterprise-level decision and action autonomy
  in:

  - value_realisation_scope: order intake to settlement (full
    enterprise-level value journey)
  - operational_scope: warehouse operations, logistics coordination,
    demand sensing, exception management
  - decision_scope: see decision_scope above
  - action_scope: see action_scope above

  The autonomy scope is bounded by the authority, policy, and
  constraint boundaries above.

# Intervention model

intervention_model: |
  Per AE-AUTO-CON-009 + AE-AUTO-CON-010 + ADR-ES-011 §9 + CR-ES-011
  §13: the enterprise intervention model is:

  - continuous: human oversight of governance bodies (quarterly
    review of decision logs)
  - conditional: human approval required when decision or action
    exceeds authority scope
  - exception-only: human escalation for severity >= medium
    exceptions
  - threshold-based: human approval required when orders exceed
    revenue_threshold_per_action (USD 75,000)
  - risk-based: human approval required for high-risk exception
    categories (regulatory, data privacy, financial cap)
  - governance-controlled: emergency intervention authority retained
    by the OTCHERE Inc governance bodies

  Human participation is permitted (human-in-the-loop, on-the-loop,
  over-the-loop). Per AE-AUTO-CON-010.

# Escalation boundary

escalation_boundary: |
  Per AE-AUTO-CON-007 + AE-AUTO-CON-008 + AE-AUTO-CON-009 +
  ADR-ES-011 §10 + §15: the escalation boundary defines when
  enterprise behaviour must escalate to human authority:

  - decision exceeds authority decision_scope: escalate
  - action exceeds authority action_scope: escalate
  - policy conflict detected: escalate
  - high-risk exception detected: escalate
  - regulatory event detected: escalate
  - data privacy violation detected: escalate
  - financial cap reached: escalate
  - emergency intervention requested: escalate
  - severity >= medium exception: escalate

  Escalation is a deterministic boundary, not a discretionary
  judgment.

# OTCHERE Inc enterprise context

enterprise_context: |
  The OTCHERE Inc fulfillment enterprise operates in a multi-channel
  retail environment with three primary sales channels: direct (web,
  mobile app), marketplace (third-party retail platforms), and
  wholesale (B2B contracts). The enterprise pursues a
  customer-service-leadership objective under defined governance and
  operates a mixed autonomous, agentic, conventional, and human-led
  realisation model.

# The scenario

scenario: |
  OTCHERE Inc operates a customer-fulfillment enterprise. Customers
  place orders; OTCHERE Inc validates and processes the orders;
  delivers products; and realises customer and enterprise value.

  In the Autonomous Enterprise representation, certain enterprise
  decisions, coordination, execution, and adaptation progress
  independently within defined boundaries, while other enterprise
  activity remains agentic, conventional, automated, or human-led.

  The enterprise-level autonomous operating loop is:

  Enterprise Objective
       |
       v
  Enterprise Context
       |
       v
  Sense
       |
       v
  Interpret
       |
       v
  Decide
       |
       v
  Coordinate
       |
       v
  Act
       |
       v
  Observe Outcome
       |
       v
  Adapt
       +------ loop back to Sense

  The loop iterates continuously, bounded by authority, policy,
  constraints, and governance.

# Mixed operating model

mixed_operating_model: |
  Per CR-ES-011 §21 + AE-AUTO-CON-017 + ADR-ES-011 §19: the OTCHERE
  Inc fulfillment enterprise demonstrates a mixed operating model.

  Value Streams:
    - autonomous_value_stream: order-to-cash (autonomous decision
      progression at customer demand, order capture, fulfillment
      path selection, exception adaptation, and settlement
      stages)
    - agentic_value_stream: customer onboarding (agentic
      interpretation and adaptation for first-time customers)
    - conventional_value_stream: post-sale support, returns
      processing, long-tail customer service
    - mixed_value_stream: wholesale B2B contract management
      (autonomous for routine renewals, human-led for negotiation)

  Operations:
    - autonomous_operations: demand response, fulfillment
      coordination, exception management (with material autonomous
      participation per ADR-ES-011 §12)
    - agentic_operations: customer onboarding, complex demand
      interpretation
    - human_led_operations: customer escalations, governance
      committee reviews, regulatory compliance reviews
    - conventional_operations: standard SLA management, routine
      reporting

  Workflows:
    - autonomous_workflows: order fulfillment, delivery exception
      handling, customer notification generation (when fully
      autonomous, the example demonstrates the Workflow execution
      mechanism, not Autonomous Workflow as a future concept per
      CR-ES-011 §27)
    - agentic_workflows: customer onboarding, complex adaptation
    - conventional_workflows: invoice generation, standard reporting

  This mixed-mode model is architecturally valid per ADR-ES-011 §19
  and AE-AUTO-CON-017. Autonomous Enterprise does NOT require every
  enterprise activity to be autonomous.

# Enterprise outcomes

enterprise_outcomes:
  - customer_satisfaction_index
  - fulfillment_velocity
  - inventory_turnover_ratio
  - operational_cost_per_order
  - exception_resolution_rate_autonomous
  - exception_resolution_rate_escalated
  - governance_audit_compliance
  - autonomy_scope_realisation_rate


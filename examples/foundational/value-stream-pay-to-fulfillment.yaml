# Worked Example: Pay-to-Fulfillment Value Stream for OTCHERE Inc
#
# Per CR-ES-003 §20 + ADR-ES-003 §22.
# Demonstrates that Value Stream semantics are independent of a fixed
# process taxonomy ;;; the progression may begin with a commercial
# or transactional trigger.
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

example_entity:
  id: ES:ENTITY:OTCHERE-INC
  canonical_name: OTCHERE Inc
  type: Entity

example_value_stream:
  id: ES:VALUE-STREAM:PAY-TO-FULFILLMENT
  canonical_name: Pay-to-Fulfillment
  status: ILLUSTRATIVE ;;; not canonical
  type: ValueStream
  definition: |
    A Value Stream whose progression begins with a commercial or
    transactional trigger (payment demand) rather than a customer
    demand. Demonstrates Value Stream semantic independence from
    process taxonomy.
  stakeholder:
    - Payer
    - OTCHERE Inc
  initiating_condition:
    type: Commercial Trigger
    description: Payment demand initiates the Value Stream.
  realization_boundary:
    description: |
      Payer receives the corresponding fulfillment and OTCHERE Inc
      realizes the commercial value.
  stages:
    - ES:VALUE-STAGE:PAY-TO-FULFILLMENT:ESTABLISH-PAYMENT
    - ES:VALUE-STAGE:PAY-TO-FULFILLMENT:CONFIRM-TRANSACTION
    - ES:VALUE-STAGE:PAY-TO-FULFILLMENT:AUTHORIZE-FULFILLMENT
    - ES:VALUE-STAGE:PAY-TO-FULFILLMENT:PREPARE-FULFILLMENT
    - ES:VALUE-STAGE:PAY-TO-FULFILLMENT:FULFILL-DEMAND
    - ES:VALUE-STAGE:PAY-TO-FULFILLMENT:CONFIRM-REALIZATION

model: |
  Payment Demand
       |
       v
  Pay-to-Fulfillment Value Stream
       |
       +-- Establish Payment
       |
       +-- Confirm Transaction
       |
       +-- Authorize Fulfillment
       |
       +-- Prepare Fulfillment
       |
       +-- Fulfill Demand
       |
       +-- Confirm Realization
       |
       v
  Payer Value Realization
       +
  Commercial Value Realization (OTCHERE Inc)

note: |
  This example demonstrates that Value Stream semantics are independent
  of a fixed process taxonomy. Per CR-ES-003 §20 ;;; the Value Stream
  represents the value journey, not the execution path. Two Value
  Streams with different initiating conditions can use overlapping
  Process, Service, and Capability sets without redefining each other.
